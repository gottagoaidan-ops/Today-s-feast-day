<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saint of the Day</title>
<style>
:root{--bg:#f6f0e4;--card:#fffaf0;--ink:#2a2118;--mute:#8a7a66;--gold:#a47a2c;--line:#e3d6bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130e;--card:#221c14;--ink:#f1e7d3;--mute:#a1927b;--gold:#d4a84f;--line:#3a3022}}
:root[data-theme="dark"]{--bg:#17130e;--card:#221c14;--ink:#f1e7d3;--mute:#a1927b;--gold:#d4a84f;--line:#3a3022}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:400;margin:0 0 6px}
.cross{font-size:1.6rem;color:var(--gold);margin-bottom:22px}
.row{display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:10px;width:100%;max-width:640px;padding:0 12px;box-sizing:border-box;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;transition:opacity .25s,transform .25s;cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card.side{opacity:.55;transform:scale(.94)}
.card.main{padding:34px 16px;min-height:230px;box-shadow:0 8px 30px rgba(0,0,0,.12);border-color:var(--gold);cursor:default}
.lbl{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-family:-apple-system,system-ui,sans-serif}
.main .lbl{color:var(--gold)}
.name{font-size:.95rem;line-height:1.25}
.main .name{font-size:1.8rem;line-height:1.2}
.date{font-size:.75rem;color:var(--mute);font-family:-apple-system,system-ui,sans-serif}
.main .date{font-size:.9rem}
.out{animation:f .3s}
@keyframes f{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
button{margin-top:22px;background:none;border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer;visibility:hidden}
button.show{visibility:visible}
.hint{margin-top:14px;font-size:.7rem;color:var(--mute);font-family:-apple-system,system-ui,sans-serif}
</style>
</head>
<body>
<h1>Saint of the Day</h1>
<div class="cross">&#10013;</div>
<div class="row" id="row"></div>
<button id="today">Back to today</button>
<div class="hint">Swipe or tap the sides to browse</div>

].map(function(m){return m.split("|")});
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var off=0,row=document.getElementById("row"),btn=document.getElementById("today");
function get(o){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);
 var n=D[d.getMonth()][d.getDate()-1]||"St. Joseph";
 return{n:n,t:DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate()}}
function lbl(o){return o==0?"Today":o==-1?"Yesterday":o==1?"Tomorrow":o<0?Math.abs(o)+" days ago":"In "+o+" days"}
function render(dx){row.innerHTML="";
 [-1,0,1].forEach(function(k){var o=off+k,s=get(o),c=document.createElement("div");
  c.className="card "+(k?"side":"main");if(dx)c.classList.add("out");c.style.setProperty("--dx",dx+"px");
  c.innerHTML='<div class="lbl">'+lbl(o)+'</div><div class="name">'+s.n+'</div><div class="date">'+s.t+'</div>';
  if(k)c.onclick=function(){go(k)};row.appendChild(c)});
 btn.className=off?"show":""}
function go(k){off+=k;render(k*40)}
btn.onclick=function(){off=0;render(0)};
var sx=null;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>40)go(d<0?1:-1)});
document.addEventListener("keydown",function(e){if(e.key=="ArrowLeft")go(-1);if(e.key=="ArrowRight")go(1)});
document.addEventListener("visibilitychange",function(){if(!document.hidden)render(0)});
render(0);
